name: Athenaeum
options:
  bundleIdPrefix: com.alleato
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Ligature:
    path: Ligature
  Forma:
    path: Forma

targets:
  Athenaeum:
    type: application
    platform: macOS
    sources:
      - path: Athenaeum
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: Forma
    info:
      path: Athenaeum/Info.plist
      properties:
        CFBundleName: Athenaeum
        CFBundleDisplayName: Athenaeum
        CFBundleIconName: AppIcon
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
            CFBundleTypeExtensions:
              - epub
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type: application/epub+zip
    entitlements:
      path: Athenaeum/Athenaeum.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alleato.athenaeum
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Athenaeum
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Octavo:
    type: application
    platform: macOS
    sources:
      - path: Octavo
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: Forma
    info:
      path: Octavo/Info.plist
      properties:
        CFBundleName: Octavo
        CFBundleDisplayName: Octavo
        CFBundleIconName: AppIcon
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.idpf.epub-container
            CFBundleTypeExtensions:
              - epub
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Document
            UTTypeConformsTo:
              - public.data
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type: application/epub+zip
    entitlements:
      path: Octavo/Octavo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alleato.octavo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Octavo
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
